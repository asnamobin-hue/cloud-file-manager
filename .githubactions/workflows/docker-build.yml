name: Build and Test Docker App

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloud-file-manager .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name test-app cloud-file-manager

      - name: Check container is running
        run: docker ps

      - name: Stop container
        run: docker stop test-app
